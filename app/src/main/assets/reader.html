<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}'">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
<style nonce="{{NONCE}}">{{CSS}}</style>
</head>
<body>
<div id="orbit-source" hidden>
<header class="orbit-title-block">
<h1 class="orbit-title">{{TITLE}}</h1>
<p class="orbit-meta">{{META}}</p>
</header>
{{CONTENT}}
</div>
<div id="orbit-book" aria-live="polite"></div>
<script nonce="{{NONCE}}">window.__orbitReader = {{CONFIG}};</script>
<script nonce="{{NONCE}}">{{SCRIPT}}</script>
</body>
</html>
